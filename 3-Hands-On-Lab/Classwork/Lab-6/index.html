<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; border-radius: 8px; background-color: #ffffff; padding: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">
        <h2 style="color: #003366; text-align: center;">BCA Student Portal Registration Form</h2>
        <form method="POST" action="./process.php">
            <!-- Task 1: Creating Fieldsets for Personal Information -->
            <fieldset style="border-radius: 8px; border: 1px solid #003366;margin: 10px; padding: 15px;">
                <legend style="color: #003366; font-weight: bold; padding: 0 5px;">Personal Information</legend>
                <p>
                    <label for="fname">Full Name:</label>
                    <input type="text" id="fname" name="fullname" style="width: 100%; padding:8px; box-sizing: border-box;">
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" style="width: 100%; padding:8px; box-sizing: border-box;" id="email" name="email">
                </p>
                <p>
                    <label>Gender</label>
                    <input id="m" type="radio" value="male" name="gender" style="width: 25%;">
                    <label for="m">Male</label>
                    <input id="f" type="radio" value="female" name="gender" style="width: 25%;">
                    <label for="f">Female</label>
                </p>
            </fieldset>
            <!-- Task 2: Creating Fieldset for Academic Details -->
            <fieldset style="border-radius: 8px; border: 1px solid #003366; margin: 10px; padding: 15px; margin-bottom: 20px;">
                <legend style="color: #003366; font-weight: bold; padding: 0 5px;">Academic Information</legend>
                <label id="stream" >Branch:</label>
                <p>
                </p><select style="width:100%; padding: 8px;" name="branch" id="stream">
                    <option value="bcc">Cloud Computing</option>
                    <option value="sacs">Cyber Security</option>
                    <option value="bcap">BCA Plain</option>
                    <option value="bcapai">BCA Plain with AI</option>
                </select>
                </p>
                <p>
                    <label>Interests:</label>
                    <input type="checkbox" name="interests" value="WebTech" id="webtech">
                    <label for="webtech">Web Technology</label>
                    <input type="checkbox" name="interests" value="CloudInfra" id="ci">
                    <label for="ci">Cloud Infrastructure</label>
                    <input type="checkbox" name="interests" value="VersionControl" id="vc">
                    <label for="vc">Version Controlling</label>
                    <input type="checkbox" name="interests" value="GameDev" id="gd">
                    <label for="gd">Game Development</label>
                </p>
                <p>
                    <label for="address">Address:</label>
                    <textarea style="width: 100%; padding: 8px; box-sizing: border-box;" name="address" id="address" rows="3"></textarea>
                </p>
            </fieldset>
            <!-- Task 3: Adding Submit and Reset Buttons -->
            <p style="text-align: center;">
                <button style="padding: 10px 20px; color: #ffffff; border-radius: 4px; border: none; background-color: #28a745; margin-left: 10px; cursor: pointer;" type="submit">Go!</button>
                <button style="padding: 10px 20px; color: #ffffff; border-radius: 4px; border: none; background-color: #dc3545; margin-left: 10px; cursor: pointer;" type="reset">Clear</button>
            </p>
        </form>
    </div>
</body>

</html>
